*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:1240px;margin:0 auto;padding-block:22px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.app{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.top h1{font-size:18px}
.top .q{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.st{font-size:12px;padding:3px 10px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.st.on{background:var(--accent);border-color:var(--accent);color:var(--accentT)}
.st.done{color:var(--accent);border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0}
.stage{padding:12px;border-right:1px solid var(--line);min-width:0}
.stage svg{display:block;width:100%;height:auto}
.side{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sec h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.big{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1}
.big small{font-size:16px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.lock{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lock span:last-child{color:var(--muted);font-size:12.5px}
.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentT);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.ch:focus-visible,.tab:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.btn.wide{width:100%}
.meas{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;align-items:baseline}
.meas b{font-family:var(--mono);font-size:17px;font-weight:500;text-align:right}
.meas .u{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--soft);grid-column:1/-1;overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%}
.note{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;padding:5px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.data{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.data>div{padding:12px 16px;min-width:0}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11.5px}

tr.cur td{background:var(--soft);font-weight:600}

.pq{margin-bottom:14px}
.pq p{margin:0 0 8px;font-size:14.5px}

.okT{color:var(--ok);font-weight:600}.noT{color:var(--warn);font-weight:600}

.radios{display:flex;gap:8px;flex-wrap:wrap}

.hidden{display:none!important}
.coord{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* svg */
.gl{stroke:rgba(0,0,0,.10);stroke-width:1}
.glM{stroke:rgba(0,0,0,.22);stroke-width:1}
.ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.lbl{font-family:var(--body);font-size:12px;fill:var(--ink)}
.lblS{font-family:var(--body);font-size:11px;fill:var(--muted)}
.call{font-family:var(--body);font-size:12px;fill:#fff}
.wm{font-family:var(--body);font-size:11px;fill:var(--muted)}

.stage .note svg{display:inline-block;width:auto;vertical-align:middle;margin-right:4px}

.mc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.mc:first-child{grid-column:1/-1}
.mh{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.mv b{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.mv small{font-size:11.5px;color:var(--muted);margin-left:4px}
.mc .bar{margin:2px 0 0}

.fixed small{display:block;font-size:11px}

.mlist div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-bottom:1px dashed var(--line);padding:3px 0}
.mlist small{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.proc{display:flex;align-items:stretch;gap:6px;margin:0 0 4px}
.pc{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--soft);display:flex;flex-direction:column;gap:1px;min-width:0;transition:border-color .3s,background .3s}
.pc b{font-size:13.5px}.pc span{font-size:12px;color:var(--muted)}.pc i{font-style:normal;font-family:var(--mono);font-weight:600;color:var(--ink)}
.pc.e b{color:var(--ero)}.pc.t b{color:var(--water)}.pc.d b{color:var(--sed)}
.pc.live{border-color:var(--ink)}
.pa{align-self:center;color:var(--muted)}
.sent{line-height:1.7}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--muted);text-align:center;font-weight:600;padding:0 4px}
.blank.on{border-color:var(--c1);color:var(--c1)}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck{display:flex;gap:8px;align-items:center;font:inherit;font-size:13.5px;text-align:left;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel);color:var(--ink);cursor:pointer}
.ck:disabled{opacity:.45;cursor:not-allowed}
.ck.on{border-color:var(--c1);background:var(--soft)}
.bx{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--c1);flex:none}
.ck.on .bx{border-color:var(--c1)}
.photobar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.photobar .note{flex-basis:100%}
.btn.sm{padding:5px 10px;font-size:13px;cursor:pointer}
@media (max-width:600px){.proc{flex-direction:column}.pa{display:none}.chk{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}@media (max-width:600px){.two{grid-template-columns:1fr}}

 var mix=$('#mix'); if(mix){ var apply=function(){ S.mix=+mix.value; var f=S.mix/100; var w=$('#baWrap'); ['#watm','#wetm','#corem'].forEach(function(id){ var p=w.querySelector(id); if(p) p.setAttribute('d',chan(S.cur.s*f)); }); w.querySelectorAll('rect[mask]').forEach(function(r){r.style.opacity=f;}); }; mix.addEventListener('input',apply); apply(); }
 var ph=$('#photo'); if(ph) ph.addEventListener('change',function(){ var f=ph.files&&ph.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ S.comm.photo=r.result; S.comm.spot=null; S.comm.obs={}; render(); }; r.readAsDataURL(f); });
 document.querySelectorAll('.stage svg[id^="svg"]').forEach(function(sv){
  var isTable=sv.id!=='svgc';
  if(isTable) sv.addEventListener('mousemove',function(e){ var p=pt(sv,e); var c=$('#coordA'); if(!c) return; if(p.x>=20&&p.x<=620&&p.y>=30&&p.y<=390) c.textContent='Position ('+((p.x-20)/10).toFixed(1)+' cm, '+((p.y-30)/10).toFixed(1)+' cm)'; else c.textContent=''; });
  if(S.screen==='predict'&&isTable) sv.addEventListener('click',function(e){ var p=pt(sv,e); if(!(p.x>=20&&p.x<=620&&p.y>=30&&p.y<=390)) return;
   var pins=S.pred.pins, hit=-1; pins.forEach(function(q,i){ if(Math.min(Math.hypot(q.x-p.x,q.y-18-p.y),Math.hypot(q.x-p.x,q.y-p.y))<14) hit=i; });
   if(hit>=0) pins.splice(hit,1); else if(pins.length<3) pins.push({x:Math.round(p.x),y:Math.round(p.y)}); render(); });
  if(S.screen==='community'&&!isTable) sv.addEventListener('click',function(e){ var p=pt(sv,e); S.comm.spot={x:p.x,y:p.y}; render(); });
 });
}
function pt(sv,e){ var p=sv.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(sv.getScreenCTM().inverse()); }
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
 var a=el.getAttribute('data-a'), v=el.getAttribute('data-v'), k=el.getAttribute('data-k');
 if(a==='go'){ S.screen=v; render(); window.scrollTo(0,0); }
 else if(a==='pred'){ S.pred[k]=v; render(); }
 else if(a==='run'){ if(!S.running) run(); }
 else if(a==='view'){ S.view=v; render(); }
 else if(a==='cmp'){ S.cmpWith=+v; render(); }
 else if(a==='graph'){ S.graph=v; render(); }
 else if(a==='pick'){ if(S.screen!=='lab') return; S.cur=S.trials.filter(function(t){return t.n==v;})[0]; S.view='result'; render(); }
 else if(a==='sideT'){ S.side=S.side==='side'?'top':'side'; render(); }
 else if(a==='cq'){ S.cmp[k]=v; render(); }
 else if(a==='ans'){ S.concl[k]=v; render(); }
 else if(a==='obs'){ S.comm.obs[v]=!S.comm.obs[v]; render(); }
 else if(a==='cqa'){ S.comm.qa[k]=v; render(); }
 else if(a==='next'){ S.comm.next=v; render(); }
 else if(a==='photoReset'){ S.comm.photo=null; S.comm.spot=null; S.comm.obs={}; render(); }
 else if(a==='restart'){ init(); render(); }
});
window.__S=function(){return S;};
window.__classify=classify;
init(); render();
})();
</script>
</body></html>
